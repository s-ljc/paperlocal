plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paperlocal'
    compileSdk 34
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.paperlocal'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.create('rel') {
                storeFile file('../keystore/release.keystore')
                storePassword 'paperlocal'
                keyAlias 'paperlocal'
                keyPassword 'paperlocal'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Pure client: no UI/网络 libraries on purpose. org.json ships with Android.
dependencies {
}
