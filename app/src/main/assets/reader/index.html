<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperLocal</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #eee; color: #222; }
  #bar { position: sticky; top: 0; display: flex; gap: 8px; align-items: center;
         background: #fff; border-bottom: 1px solid #ddd; padding: 8px 12px; z-index: 30; }
  #bar h1 { font-size: 15px; margin: 0; flex: 1; overflow: hidden;
            white-space: nowrap; text-overflow: ellipsis; }
  .chip { font-size: 13px; border: 1px solid #bbb; border-radius: 14px;
          padding: 5px 12px; background: #f2f2f7; user-select: none; cursor: pointer;
          max-width: 40vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chip:active { background: #d8d8e0; }
  #status { font-size: 12px; color: #666; padding: 4px 12px; min-height: 18px;
            position: sticky; top: 49px; background: #eee; z-index: 20; }
  #pages { padding: 8px 8px 90px; }
  .page { position: relative; margin: 0 auto 10px; background: #fff;
          box-shadow: 0 1px 4px rgba(0,0,0,.25); min-height: 200px; }
  .page canvas { display: block; width: 100%; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1;
               color: transparent; }
  .textLayer span { position: absolute; white-space: pre; color: transparent;
                    transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(0,120,255,.35); color: transparent; }
  .tr { background: #fffbe6; border-left: 3px solid #f0b90b; padding: 10px 12px;
        margin: 8px auto; font-size: 15px; white-space: pre-wrap; max-width: 98%;
        box-shadow: 0 1px 3px rgba(0,0,0,.15); position: relative; }
  .tr b { display: block; font-size: 11px; color: #a08000; margin-bottom: 4px; }
  .tr .x { position: absolute; top: 4px; right: 8px; color: #999; font-size: 16px;
           cursor: pointer; }
  /* floating translate button on selection */
  #trBtn { position: fixed; display: none; z-index: 40; background: #1a73e8; color: #fff;
           border-radius: 18px; padding: 8px 16px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  /* chat */
  #chat { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 50;
          transform: translateY(100%); transition: transform .25s; background: #fff;
          display: flex; flex-direction: column; height: 62vh;
          box-shadow: 0 -2px 12px rgba(0,0,0,.3); border-top: 1px solid #ccc; }
  #chat.open { transform: translateY(0); }
  #chatHead { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
              border-bottom: 1px solid #ddd; background: #fafafa; }
  #chatHead h2 { font-size: 14px; margin: 0; flex: 1; }
  #msgs { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 14px; }
  .msg { margin: 6px 0; padding: 8px 10px; border-radius: 10px; max-width: 88%;
         white-space: pre-wrap; word-break: break-word; }
  .msg.u { background: #cfe3ff; margin-left: auto; }
  .msg.a { background: #f0f0f2; }
  .msg.err { background: #fdd; }
  #chatRow { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #ddd; }
  #inp { flex: 1; font-size: 14px; padding: 8px; border: 1px solid #bbb; border-radius: 8px; }
  #send { border: 0; background: #1a73e8; color: #fff; border-radius: 8px;
          padding: 0 18px; font-size: 14px; }
  #send:disabled { background: #9bb; }
  /* model sheet */
  #sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.4); display: none; }
  #sheet .card { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
                 width: 86%; max-height: 60vh; overflow-y: auto; background: #fff;
                 border-radius: 14px; padding: 12px; }
  #sheet h3 { margin: 4px 4px 10px; font-size: 15px; }
  .prof { padding: 12px; border-radius: 10px; font-size: 14px; }
  .prof:active { background: #eee; }
  .prof.on { background: #e3efff; }
  .prof small { color: #777; display: block; font-size: 11px; }
</style>
</head>
<body>
  <div id="bar">
    <h1 id="title">PaperLocal</h1>
    <span class="chip" id="model">🤖 …</span>
    <span class="chip" id="chatBtn">💬 问文档</span>
  </div>
  <div id="status"></div>
  <div id="pages"></div>
  <div id="trBtn">翻译</div>

  <div id="chat">
    <div id="chatHead">
      <h2>文档对话</h2>
      <span class="chip" id="chatModel">🤖 …</span>
      <span class="chip" id="chatClose">收起</span>
    </div>
    <div id="msgs"></div>
    <div id="chatRow">
      <input id="inp" placeholder="就这篇论文提问…" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>

  <div id="sheet"><div class="card"><h3>切换模型</h3><div id="profList"></div></div></div>

  <script src="reader.js"></script>
</body>
</html>
